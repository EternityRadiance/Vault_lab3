directive @isAuthenticated on FIELD_DEFINITION
directive @isAdmin on FIELD_DEFINITION

"Пользователь системы"
type User {
    id: ID!
    email: String!
    isActive: Boolean!
    isAdmin: Boolean!
    createdAt: String!
}

"OAuth-клиент"
type Client {
    id: ID!
    clientId: String!
    name: String!
    isConfidential: Boolean!
    redirectUris: [String!]!
    createdAt: String!
}

"Событие аудита"
type AuditEvent {
    id: ID!
    eventType: String!
    actorId: Int
    clientId: String
    ip: String
    userAgent: String
    metadata: String
    createdAt: String!
}

"Пользовательская сессия (refresh)"
type Session {
    id: ID!
    clientId: String!
    familyId: String!
    ip: String
    userAgent: String
    createdAt: String!
    lastSeenAt: String!
    revokedAt: String
}

"Информация о refresh-токене (без значения)"
type RefreshTokenInfo {
    id: ID!
    jti: String!
    familyId: String!
    clientId: String!
    scope: String!
    expiresAt: String!
    usedAt: String
    revokedAt: String
    createdAt: String!
}

"Результат регистрации/логина"
type AuthPayload {
    accessToken: String!
    tokenType: String!
}

type Query {
    "Текущий пользователь, требует аутентификации"
    me: User! @isAuthenticated

    "Список пользователей с поиском и разделением на страницы. Только для админов"
    users(search: String, limit: Int = 50, offset: Int = 0): [User!]! @isAdmin

    "Список OAuth-клиентов. Только для админов"
    clients: [Client!]! @isAdmin

    "Журнал аудита. Только для админов"
    auditEvents(eventType: String, limit: Int = 100, offset: Int = 0): [AuditEvent!]! @isAdmin

    "Список активных сессий пользователя. Только для админов."
    sessions(userId: ID!): [Session!]! @isAdmin

    "Список refresh-токенов пользователя. Только для админов."
    refreshTokens(userId: ID!): [RefreshTokenInfo!]! @isAdmin   
}

type Mutation {
    "Регистрация нового пользователя. Публичная"
    registerUser(email: String!, password: String!): AuthPayload!

    "Создать OAuth-клиента. Только для админов"
    createClient(name: String!, isConfidential: Boolean = true): Client! @isAdmin

    "Отключить пользователя. Только для админов"
    disableUser(userId: ID!): User! @isAdmin

    "Отозвать все сессии пользователя. Возвращает количество отозванных сессий."
    revokeUserSessions(userId: ID!): Int! @isAdmin
}