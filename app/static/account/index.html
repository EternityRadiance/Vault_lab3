<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — Аккаунт</title>
    <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
    <header>
        <h1>Vault</h1>
        <button id="logout-btn" class="hidden">Выйти</button>
    </header>

    <main>
        <section id="register-section">
            <h2>Регистрация</h2>
            <form id="register-form">
                <label>
                    Email
                    <input type="email" id="register-email" required autocomplete="username">
                </label>
                <label>
                    Пароль
                    <input type="password" id="register-password" required autocomplete="new-password">
                    <small>Минимум 12 символов, не должен быть предсказуемым.</small>
                </label>
                <button type="submit">Зарегистрироваться</button>
            </form>
            <p id="register-error" class="error hidden"></p>
            <p>Уже есть аккаунт? <a href="#" id="to-login">Войти</a></p>
        </section>

        <section id="login-section" class="hidden">
            <h2>Вход</h2>
            <form id="login-form">
                <label>
                    Email
                    <input type="email" id="login-email" required autocomplete="username">
                </label>
                <label>
                    Пароль
                    <input type="password" id="login-password" required autocomplete="current-password">
                </label>
                <button type="submit">Войти</button>
            </form>
            <p id="login-error" class="error hidden"></p>
            <p>Нет аккаунта? <a href="#" id="to-register">Зарегистрироваться</a></p>
        </section>

        <section id="profile-section" class="hidden">
            <h2>Мой профиль</h2>
            <pre id="profile-output" class="output"></pre>
            <p id="profile-error" class="error hidden"></p>
            <button id="reload-profile-btn">Обновить</button>
        </section>
    </main>

    <script src="/account/app.js"></script>
</body>
</html>
