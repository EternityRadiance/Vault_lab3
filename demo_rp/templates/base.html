<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Vault Demo RP</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
        h1 { color: #212529; }
        .card { background: #f8f9fa; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        button, a.btn { padding: 0.5rem 1rem; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        button:hover, a.btn:hover { background: #0b5ed7; }
        form { display: inline; }
        pre { background: #e9ecef; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; }
        .logout { background: #dc3545; }
        .logout:hover { background: #bb2d3b; }
    </style>
</head>
<body>
    <h1>Vault Demo RP</h1>
    {% block content %}{% endblock %}
</body>
</html>
